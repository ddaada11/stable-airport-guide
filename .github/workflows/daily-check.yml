name: daily-check

# 每天自动检测各家专线机场官网可用性，更新 README 的「最近 7 天可用性」表格

on:
  schedule:
    # UTC 22:30 = 北京时间 06:30，每天一次（错开主仓库的 22:00）
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check uptime and update README
        run: node scripts/daily-check.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/uptime.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily uptime check $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
